name: V2 CPU Gate

on:
  workflow_dispatch:
  push:
    branches: [main, service_dev]
    paths:
      - '.github/workflows/v2_cpu.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tests/**'
      - 'third_party/xllm'
      - 'vcpkg.json'
      - 'vllm_sidecar/**'
      - 'xllm_service/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, service_dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  DEPENDENCES_ROOT: ${{ github.workspace }}/.ci/dependencies
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.ci/vcpkg-binaries
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.ci/vcpkg-downloads
  VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg

jobs:
  pinned-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout pinned dependency graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify pinned V2 protocol source
        run: scripts/verify_v2_pin.sh

      - name: Install CPU build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ccache clang cmake curl \
            file flex libasio-dev libcurl4-openssl-dev libibverbs-dev \
            libmsgpack-cxx-dev libnuma-dev libssl-dev libtool libunwind-dev \
            liburing-dev libxxhash-dev libzstd-dev nasm ninja-build patch \
            patchelf pkg-config python3-dev python3-venv rsync unzip zip \
            zlib1g-dev

      - name: Install Torch CPU test runtime
        run: |
          python3 -m venv .ci/venv
          .ci/venv/bin/python -m pip install --upgrade pip
          .ci/venv/bin/python -m pip install pytest requests
          .ci/venv/bin/python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            .ci/dependencies
            .ci/vcpkg-binaries
            .ci/vcpkg-downloads
          key: v2-cpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'third_party/xllm/vcpkg.json') }}
          restore-keys: |
            v2-cpu-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap vcpkg
        run: |
          git clone --branch 2024.02.14 --depth 1 \
            https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Prepare source dependencies
        run: |
          export PATH="$PWD/.ci/venv/bin:$PATH"
          bash prepare.sh
          cd third_party/xllm
          bash third_party/dependencies.sh

      - name: Build and test pinned xllm-service
        run: |
          export PATH="$PWD/.ci/venv/bin:$PATH"
          cmake -S . -B build/v2-cpu-service -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_ASCEND=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS=-Wno-register \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/v2-cpu-service --target tests/xllm_service/all
          ctest --test-dir build/v2-cpu-service \
            --output-on-failure --no-tests=error
          cmake --build build/v2-cpu-service --target \
            xllm_master_serving xllm_http_serving xllm_rpc_serving
          .ci/venv/bin/python -m pytest \
            vllm_sidecar/tests tests/e2e/test_online_cluster_stress.py -q

      - name: Build and test pinned xLLM CPU contracts
        run: |
          export PATH="$PWD/.ci/venv/bin:$PATH"
          export LIBTORCH_ROOT="$PWD/.ci/venv/lib/python3.12/site-packages/torch/share/cmake/Torch"
          cmake -S third_party/xllm -B build/v2-cpu-xllm -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDEVICE_ARCH=X86 \
            -DUSE_NPU=OFF -DUSE_MLU=OFF -DUSE_ILU=OFF -DUSE_CUDA=OFF \
            -DUSE_MUSA=OFF -DUSE_DCU=OFF -DUSE_MACA=OFF \
            -DUSE_CXX11_ABI=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS='-Wno-register -Wno-parentheses' \
            -DPython_EXECUTABLE="$PWD/.ci/venv/bin/python" \
            -DPython3_EXECUTABLE="$PWD/.ci/venv/bin/python" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/v2-cpu-xllm --target \
            xllm_proto partial_json_parser_test anthropic_protocol_test \
            anthropic_stream_utils_test attempt_lifecycle_table_test \
            simulated_hbm_test \
            registration_lifecycle_test provider_protocol_test \
            request_event_protocol_test
          build/v2-cpu-xllm/tests/api_service/anthropic_protocol_test
          build/v2-cpu-xllm/tests/api_service/anthropic_stream_utils_test
          build/v2-cpu-xllm/tests/core/distributed_runtime/attempt_lifecycle_table_test
          build/v2-cpu-xllm/tests/core/framework/kv_cache/simulated_hbm_test
          build/v2-cpu-xllm/tests/core/runtime/registration_lifecycle_test
          build/v2-cpu-xllm/tests/function_call/partial_json_parser/partial_json_parser_test
          build/v2-cpu-xllm/tests/proto/provider_protocol_test
          build/v2-cpu-xllm/tests/proto/request_event_protocol_test
