apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: xllm-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: xllm-service
      app.kubernetes.io/component: adapter
  targetPorts:
    - number: 8888
  appProtocol: http
  endpointPickerRef:
    name: xllm-service-epp
    port:
      number: 9002
    failureMode: FailClose
