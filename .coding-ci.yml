.v2-cpu-pipeline: &v2-cpu-pipeline
  name: V2 CPU Gate
  runner:
    cpus: 4
  docker:
    image: ubuntu:24.04
  git:
    enable: true
    submodules: true
  env:
    CMAKE_BUILD_PARALLEL_LEVEL: "4"
    DEPENDENCES_ROOT: .ci/dependencies
    VCPKG_DEFAULT_BINARY_CACHE: .ci/vcpkg-binaries
    VCPKG_DOWNLOADS: .ci/vcpkg-downloads
    VCPKG_ROOT: .ci/vcpkg
  stages:
    - name: Install CPU build prerequisites
      script: |
        apt-get update
        apt-get install -y --no-install-recommends \
          autoconf automake bison build-essential ca-certificates ccache \
          clang cmake curl file flex git libasio-dev libcurl4-openssl-dev \
          etcd-client etcd-server libibverbs-dev libmsgpack-cxx-dev \
          libnuma-dev libssl-dev libtool \
          libunwind-dev liburing-dev libxxhash-dev libzstd-dev nasm \
          ninja-build patch patchelf pkg-config python3-dev python3-venv \
          rsync unzip zip zlib1g-dev

    - name: Install Torch CPU test runtime
      script: |
        python3 -m venv .ci/venv
        .ci/venv/bin/python -m pip install --upgrade pip
        .ci/venv/bin/python -m pip install pre-commit==4.2.0 pytest requests
        .ci/venv/bin/python -m pip install \
          --index-url https://download.pytorch.org/whl/cpu torch==2.10.0

    - name: Verify repository C++ format
      script: |
        .ci/venv/bin/pre-commit run --all-files --show-diff-on-failure

    - name: Verify and prepare pinned dependencies
      script: |
        export DEPENDENCES_ROOT="$PWD/.ci/dependencies"
        export VCPKG_DEFAULT_BINARY_CACHE="$PWD/.ci/vcpkg-binaries"
        export VCPKG_DOWNLOADS="$PWD/.ci/vcpkg-downloads"
        export VCPKG_ROOT="$PWD/.ci/vcpkg"
        scripts/verify_v2_pin.sh
        if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
          git clone --branch 2024.02.14 --depth 1 \
            https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        fi
        export PATH="$PWD/.ci/venv/bin:$PATH"
        bash prepare.sh
        cd third_party/xllm
        bash third_party/dependencies.sh

    - name: Build and test pinned xllm-service
      script: |
        export PATH="$PWD/.ci/venv/bin:$PATH"
        cmake -S . -B build/v2-cpu-service -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DUSE_ASCEND=OFF \
          -DBUILD_TESTING=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS=-Wno-register \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        cmake --build build/v2-cpu-service --target tests/xllm_service/all
        ctest --test-dir build/v2-cpu-service \
          --output-on-failure --no-tests=error
        cmake --build build/v2-cpu-service --target \
          xllm_master_serving xllm_http_serving xllm_rpc_serving \
          xllm_service_mock_native_engine
        .ci/venv/bin/python -m pytest \
          vllm_sidecar/tests tests/e2e/test_online_cluster_stress.py -q

    - name: V2 and V3 offline cluster E2E hard gate
      script: |
        export PATH="$PWD/.ci/venv/bin:$PATH"
        .ci/venv/bin/python tests/e2e/online_cluster_stress.py \
          --scenario all --mode smoke --build-dir build/v2-cpu-service

    - name: Build and test pinned xLLM CPU contracts
      script: |
        export PATH="$PWD/.ci/venv/bin:$PATH"
        export LIBTORCH_ROOT="$($PWD/.ci/venv/bin/python -c \
          'import torch; print(torch.utils.cmake_prefix_path)')"
        cmake -S third_party/xllm -B build/v2-cpu-xllm -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DDEVICE_ARCH=X86 \
          -DUSE_NPU=OFF -DUSE_MLU=OFF -DUSE_ILU=OFF -DUSE_CUDA=OFF \
          -DUSE_MUSA=OFF -DUSE_DCU=OFF -DUSE_MACA=OFF \
          -DUSE_CXX11_ABI=ON \
          -DBUILD_TESTING=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS='-Wno-register -Wno-parentheses' \
          -DPython_EXECUTABLE="$PWD/.ci/venv/bin/python" \
          -DPython3_EXECUTABLE="$PWD/.ci/venv/bin/python" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        cmake --build build/v2-cpu-xllm --target \
          xllm_proto partial_json_parser_test anthropic_protocol_test \
          anthropic_stream_utils_test attempt_lifecycle_table_test \
          simulated_hbm_test native_lifecycle_controller_test \
          native_provider_contract_test registration_lifecycle_test \
          provider_protocol_test request_event_protocol_test
        build/v2-cpu-xllm/tests/api_service/anthropic_protocol_test
        build/v2-cpu-xllm/tests/api_service/anthropic_stream_utils_test
        build/v2-cpu-xllm/tests/core/distributed_runtime/attempt_lifecycle_table_test
        build/v2-cpu-xllm/tests/core/framework/kv_cache/simulated_hbm_test
        build/v2-cpu-xllm/tests/core/runtime/native_lifecycle_controller_test
        build/v2-cpu-xllm/tests/core/runtime/native_provider_contract_test
        build/v2-cpu-xllm/tests/core/runtime/registration_lifecycle_test
        build/v2-cpu-xllm/tests/function_call/partial_json_parser/partial_json_parser_test
        build/v2-cpu-xllm/tests/proto/provider_protocol_test
        build/v2-cpu-xllm/tests/proto/request_event_protocol_test

main:
  push:
    - <<: *v2-cpu-pipeline
  merge_request:
    - <<: *v2-cpu-pipeline

service_dev:
  push:
    - <<: *v2-cpu-pipeline
  merge_request:
    - <<: *v2-cpu-pipeline
